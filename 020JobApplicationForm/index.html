<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel='stylesheet' href='styles.css'>
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" required>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
                <label for="position">Position:</label>
                <select name="position" id="position" required>
                    <option value="">-- Select a Position</option>
                    <option value="developer">Developer</option>
                    <option value="designer">Designer</option>
                    <option value="manager">Manager</option>
                    <option value="engineer">Engineer</option>
                </select>
                <fieldset class="radio-group">
                    <legend>Availability:</legend>

                    <input type="radio" name="availability" id="fulltime" value="fulltime" required>
                    <label for="fulltime">Full-Time</label>
                    <input type="radio" name="availability" id="parttime" value="parttime" required>
                    <label for="parttime">Part-Time</label>
                </fieldset>
                <label for="message">Why do you want this job?</label>
                <textarea name="message" id="message" cols="30" rows="10" placeholder="write your motivation" required>
                </textarea>
                <button type="submit">Submit Your Application</button>
            </div>
        </form>
    </div>
</body>
</html>
